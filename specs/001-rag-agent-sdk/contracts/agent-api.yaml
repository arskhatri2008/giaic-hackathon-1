openapi: 3.0.0
info:
  title: RAG Agent API
  description: API for the RAG-enabled agent that answers questions based on book content
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /ask:
    post:
      summary: Ask a question about the book content
      description: Submit a question to the RAG agent and receive an answer based on retrieved book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  description: The question to ask about the book content
                  example: "What are the key concepts in chapter 1?"
                context_filter:
                  type: object
                  description: Optional filters for the content retrieval
                  properties:
                    book_title:
                      type: string
                      description: Specific book to search in
                    chapter:
                      type: string
                      description: Specific chapter to search in
      responses:
        '200':
          description: Successful response with answer and source information
          content:
            application/json:
              schema:
                type: object
                required:
                  - answer
                  - sources
                  - grounded
                properties:
                  answer:
                    type: string
                    description: The agent's answer to the question
                    example: "The key concepts in chapter 1 include..."
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        content_id:
                          type: string
                          description: Unique identifier of the source content
                        text:
                          type: string
                          description: The text of the source content
                        metadata:
                          type: object
                          description: Additional metadata about the source
                  grounded:
                    type: boolean
                    description: Whether the response is grounded in retrieved content
                    example: true
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    description: Error message explaining the issue
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    description: Error message explaining the issue

  /health:
    get:
      summary: Health check endpoint
      description: Check if the RAG agent service is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    description: Health status
                    example: "healthy"